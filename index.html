<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickFix — Campus Peer Learning & Doubt Bounty Board</title>
    <meta name="description" content="Connect with skilled peers on campus for quick 15-minute live video mentoring sessions, solve coding and academic doubts, and earn contribution points." />
    <meta property="og:title" content="QuickFix — Campus Peer Learning & Doubt Bounty Board" />
    <meta property="og:description" content="Connect with skilled peers on campus for quick 15-minute live video mentoring sessions, solve coding and academic doubts, and earn contribution points." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('quickfix_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAF9] dark:bg-[#0F172A] text-zinc-900 dark:text-[#F8FAFC] antialiased selection:bg-indigo-100 dark:selection:bg-[#818CF8]/30 selection:text-indigo-900 dark:selection:text-[#F8FAFC]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
